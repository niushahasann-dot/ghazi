<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (full bleed) -->
    <radialGradient id="bgGradMask" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1f1d18" />
      <stop offset="70%" stop-color="#0f0e0c" />
      <stop offset="100%" stop-color="#070706" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Bronze Wood Gradient -->
    <linearGradient id="woodGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Dark Metal Gradient -->
    <linearGradient id="metalGradMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="50%" stop-color="#78716c" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Square Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Inner Safe Zone Group (scaled to 82% to fit comfortably inside the Android mask circle) -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">
    <!-- Justice Seal Outer Ring -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGradMask)" stroke-width="3" stroke-opacity="0.5" />
    <circle cx="256" cy="256" r="176" fill="#141310" stroke="url(#goldGradMask)" stroke-width="2" stroke-opacity="0.7" />
    <circle cx="256" cy="256" r="166" fill="none" stroke="#eab308" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="5 5" />

    <!-- Scales of Justice + Judge Gavel -->
    <g transform="translate(256, 240)">
      <!-- Pillar -->
      <path d="M -5 -110 L 5 -110 L 4 75 L 24 95 L -24 95 L -4 75 Z" fill="url(#goldGradMask)" />
      <circle cx="0" cy="-115" r="10" fill="url(#goldGradMask)" stroke="#fef08a" stroke-width="1.5" />

      <!-- Crossbar -->
      <path d="M -115 -82 Q 0 -92 115 -82 Q 0 -84 -115 -82 Z" fill="url(#goldGradMask)" stroke="#854d0e" stroke-width="1" />
      <circle cx="-115" cy="-82" r="6" fill="url(#goldGradMask)" />
      <circle cx="115" cy="-82" r="6" fill="url(#goldGradMask)" />
      <circle cx="0" cy="-87" r="7" fill="url(#goldGradMask)" />

      <!-- Left Pan -->
      <line x1="-115" y1="-82" x2="-140" y2="-22" stroke="#eab308" stroke-width="2" opacity="0.8" />
      <line x1="-115" y1="-82" x2="-90" y2="-22" stroke="#eab308" stroke-width="2" opacity="0.8" />
      <path d="M -148 -22 Q -115 -6 -82 -22 Z" fill="url(#goldGradMask)" stroke="#78350f" stroke-width="1.5" />

      <!-- Right Pan -->
      <line x1="115" y1="-82" x2="90" y2="-22" stroke="#eab308" stroke-width="2" opacity="0.8" />
      <line x1="115" y1="-82" x2="140" y2="-22" stroke="#eab308" stroke-width="2" opacity="0.8" />
      <path d="M 82 -22 Q 115 -6 148 -22 Z" fill="url(#goldGradMask)" stroke="#78350f" stroke-width="1.5" />

      <!-- Judge Gavel -->
      <g transform="rotate(-28, 15, 30)">
        <path d="M -75 22 L 80 22 L 80 32 L -75 32 Z" fill="url(#woodGradMask)" stroke="#451a03" stroke-width="1.5" rx="3" />
        <rect x="60" y="20" width="22" height="14" rx="2" fill="url(#goldGradMask)" />
        <g transform="translate(-75, 27)">
          <rect x="-24" y="-36" width="48" height="72" rx="7" fill="url(#woodGradMask)" stroke="#270a00" stroke-width="2" />
          <rect x="-24" y="-22" width="48" height="10" fill="url(#goldGradMask)" opacity="0.9" />
          <rect x="-24" y="12" width="48" height="10" fill="url(#goldGradMask)" opacity="0.9" />
          <rect x="-26" y="-38" width="52" height="5" rx="2" fill="url(#goldGradMask)" />
          <rect x="-26" y="33" width="52" height="5" rx="2" fill="url(#goldGradMask)" />
        </g>
        <ellipse cx="-75" cy="62" rx="46" ry="12" fill="url(#metalGradMask)" stroke="url(#goldGradMask)" stroke-width="2" />
        <ellipse cx="-75" cy="58" rx="42" ry="10" fill="url(#woodGradMask)" />
      </g>
    </g>

    <!-- Typography -->
    <g transform="translate(256, 436)">
      <text x="0" y="4" text-anchor="middle" font-family="'Vazirmatn', 'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="34" fill="url(#goldGradMask)" letter-spacing="1">آقای قاضی</text>
      <text x="0" y="24" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="12" fill="#a8a29e" letter-spacing="4">MR. JUDGE</text>
    </g>
  </g>
</svg>
