<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1f1d18" />
      <stop offset="70%" stop-color="#0f0e0c" />
      <stop offset="100%" stop-color="#070706" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Bronze Wood Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>

    <!-- Dark Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="50%" stop-color="#78716c" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#eab308" flood-opacity="0.3" />
    </filter>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Double Gold Rim -->
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.45" />
  <rect x="32" y="32" width="448" height="448" rx="76" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 4" />

  <!-- Corner Ornamental Accents -->
  <path d="M 44 70 L 70 44" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 468 70 L 442 44" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 44 442 L 70 468" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 468 442 L 442 468" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Central Justice Seal Circle -->
  <circle cx="256" cy="256" r="172" fill="#141310" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.6" filter="url(#subtleShadow)" />
  <circle cx="256" cy="256" r="162" fill="none" stroke="#eab308" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />

  <!-- Central Emblem: Scales of Justice + Judge Gavel -->
  <g filter="url(#goldGlow)" transform="translate(256, 240)">
    <!-- Scales Central Pillar -->
    <path d="M -5 -110 L 5 -110 L 4 75 L 24 95 L -24 95 L -4 75 Z" fill="url(#goldGrad)" />
    <!-- Pillar Finial (Top Sphere) -->
    <circle cx="0" cy="-115" r="10" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5" />
    <circle cx="0" cy="-115" r="4" fill="#ffffff" opacity="0.6" />

    <!-- Balance Beam (Crossbar) -->
    <path d="M -115 -82 Q 0 -92 115 -82 Q 0 -84 -115 -82 Z" fill="url(#goldGrad)" stroke="#854d0e" stroke-width="1" />
    <circle cx="-115" cy="-82" r="6" fill="url(#goldGrad)" />
    <circle cx="115" cy="-82" r="6" fill="url(#goldGrad)" />
    <circle cx="0" cy="-87" r="7" fill="url(#goldGrad)" />

    <!-- Left Pan Strings & Plate -->
    <line x1="-115" y1="-82" x2="-140" y2="-22" stroke="#eab308" stroke-width="2" opacity="0.8" />
    <line x1="-115" y1="-82" x2="-90" y2="-22" stroke="#eab308" stroke-width="2" opacity="0.8" />
    <path d="M -148 -22 Q -115 -6 -82 -22 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />

    <!-- Right Pan Strings & Plate -->
    <line x1="115" y1="-82" x2="90" y2="-22" stroke="#eab308" stroke-width="2" opacity="0.8" />
    <line x1="115" y1="-82" x2="140" y2="-22" stroke="#eab308" stroke-width="2" opacity="0.8" />
    <path d="M 82 -22 Q 115 -6 148 -22 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5" />

    <!-- Judge Gavel (Across Foreground, slightly angled 25 deg) -->
    <g transform="rotate(-28, 15, 30)">
      <!-- Gavel Handle -->
      <path d="M -75 22 L 80 22 L 80 32 L -75 32 Z" fill="url(#woodGrad)" stroke="#451a03" stroke-width="1.5" rx="3" />
      <rect x="60" y="20" width="22" height="14" rx="2" fill="url(#goldGrad)" />
      <!-- Gavel Head -->
      <g transform="translate(-75, 27)">
        <rect x="-24" y="-36" width="48" height="72" rx="7" fill="url(#woodGrad)" stroke="#270a00" stroke-width="2" />
        <!-- Head Brass Rings -->
        <rect x="-24" y="-22" width="48" height="10" fill="url(#goldGrad)" opacity="0.9" />
        <rect x="-24" y="12" width="48" height="10" fill="url(#goldGrad)" opacity="0.9" />
        <!-- End Plates -->
        <rect x="-26" y="-38" width="52" height="5" rx="2" fill="url(#goldGrad)" />
        <rect x="-26" y="33" width="52" height="5" rx="2" fill="url(#goldGrad)" />
      </g>
      <!-- Sound Block Base -->
      <ellipse cx="-75" cy="62" rx="46" ry="12" fill="url(#metalGrad)" stroke="url(#goldGrad)" stroke-width="2" />
      <ellipse cx="-75" cy="58" rx="42" ry="10" fill="url(#woodGrad)" />
    </g>
  </g>

  <!-- Title Ribbon / Typography at Bottom -->
  <g transform="translate(256, 436)">
    <!-- Small laurel branches -->
    <path d="M -120 -8 Q -60 -26 -15 -18" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    <circle cx="-120" cy="-8" r="3" fill="#eab308" />
    <circle cx="-80" cy="-18" r="2.5" fill="#eab308" />
    <circle cx="-45" cy="-21" r="2.5" fill="#eab308" />

    <path d="M 120 -8 Q 60 -26 15 -18" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    <circle cx="120" cy="-8" r="3" fill="#eab308" />
    <circle cx="80" cy="-18" r="2.5" fill="#eab308" />
    <circle cx="45" cy="-21" r="2.5" fill="#eab308" />

    <!-- Persian Typography: آقای قاضی -->
    <text x="0" y="4" text-anchor="middle" font-family="'Vazirmatn', 'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="34" fill="url(#goldGrad)" letter-spacing="1">آقای قاضی</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="12" fill="#a8a29e" letter-spacing="4">MR. JUDGE</text>
  </g>
</svg>
